name: Application and installer checks
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Ubuntu shell syntax
        run: |
          bash -n install.sh
          bash -n deployment/homecloud-updater
          bash -n deployment/setup-updater.sh
          bash deployment/test-updater.sh
          bash -n deployment/homecloud
          bash -n deployment/network.sh
          bash deployment/test-network.sh
          sh -n deployment/generate-secrets.sh
          bash install.sh --help
      - name: Check private secret generation
        run: |
          sh deployment/generate-secrets.sh
          test "$(stat -c %a .env)" = 600
          if sh deployment/generate-secrets.sh; then exit 1; fi
          docker compose config --quiet
          rm .env
      - run: npm ci --workspaces=false
        working-directory: apps/api
      - run: npm test --workspaces=false
        working-directory: apps/api
      - run: npm ci --workspaces=false
        working-directory: apps/web
      - run: npm test --workspaces=false
        working-directory: apps/web
      - run: npm run build --workspaces=false
        working-directory: apps/web
      - name: Build and start the deployment
        run: |
          sh deployment/generate-secrets.sh > /dev/null
          docker compose up -d --build --wait --wait-timeout 180
          docker compose exec -T caddy cat /data/caddy/pki/authorities/local/root.crt > /tmp/homecloud-ci-root.crt
          curl --fail --show-error --cacert /tmp/homecloud-ci-root.crt https://localhost:6002/api/health
          NODE_EXTRA_CA_CERTS=/tmp/homecloud-ci-root.crt node deployment/check-registration.mjs
      - name: Deployment logs and cleanup
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose logs --tail=100
            docker compose down --volumes
          fi
