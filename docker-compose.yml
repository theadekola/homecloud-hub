name: homecloud-hub

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "${WEB_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - backend
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file: .env
    expose:
      - "6000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - edge
    environment:
      DATA_DIR: /app/runtime
      PORT: "6000"
    volumes:
      - ./runtime:/app/runtime
      - ./secrets/docker:/run/homecloud/docker:ro
      - ./secrets/ca:/run/homecloud/ca:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
